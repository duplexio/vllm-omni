<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>duplexio</title>
    <style>
      :root {
        color-scheme: dark;
        font: 16px/1.5 system-ui, sans-serif;
        background: #101114;
        color: #f4f4f5;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        box-sizing: border-box;
        width: min(92vw, 420px);
        padding: 32px;
        border: 1px solid #2b2d33;
        border-radius: 18px;
        background: #17181c;
        box-shadow: 0 20px 60px #0006;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 28px;
      }
      .brand img {
        display: block;
        margin: 0;
      }
      .mark {
        width: 46px;
        height: 46px;
        object-fit: cover;
      }
      .wordmark {
        width: auto;
        height: 38px;
        filter: brightness(0) invert(1);
      }
      form { display: grid; gap: 14px; }
      label { color: #a1a1aa; font-size: 13px; }
      input {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #3f3f46;
        border-radius: 10px;
        padding: 11px 12px;
        color: #f4f4f5;
        background: #27272a;
        font: inherit;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 11px 18px;
        color: #fff;
        background: #2563eb;
        font: inherit;
        cursor: pointer;
      }
      .error { min-height: 24px; margin: 0; color: #fb7185; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" aria-label="duplexio">
        <img class="mark" src="/static/logo.png" alt="">
        <img class="wordmark" src="/static/logo-wordmark.svg" alt="duplexio">
      </div>
      <form method="post" action="/login">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          autofocus
          required
        >
        <button type="submit">Continue</button>
        <p class="error" role="alert">__DUPLEXIO_LOGIN_ERROR__</p>
      </form>
    </main>
  </body>
</html>
