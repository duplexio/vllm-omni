# Native single-stage DuplexIO deployment.
pipeline: duplexio
async_chunk: false
session_mode: duplex
active_stream_window: 1
dtype: bfloat16
enable_prefix_caching: false
enable_chunked_prefill: true

duplex_session:
  max_sessions: 1

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    # Six scheduler positions represent one 80 ms DuplexIO frame. Keep the
    # complete cache layout while bounding each prefill/profile forward.
    max_model_len: 24576
    max_num_batched_tokens: 4096
    # FlexAttention tiles pages, so the page must be a power of two. Without
    # this the hybrid cache would derive 528 tokens per page from the mamba
    # state size. 1024 spans the same slots in fewer, larger pages.
    block_size: 1024
    # Reserve activation headroom for the session's tool-aware system prefill.
    # The remaining KV cache still exceeds one maximum-length session.
    gpu_memory_utilization: 0.7
    enforce_eager: false
    async_scheduling: false
    compilation_config:
      mode: 0
      cudagraph_mode: FULL
      # With max_num_seqs=1, every live append is one uniform six-cell frame.
      # Larger system/tool prefills run eagerly outside this graph.
      cudagraph_capture_sizes: [6]
      cudagraph_copy_inputs: true
