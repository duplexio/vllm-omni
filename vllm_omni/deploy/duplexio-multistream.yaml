# Native two-stream DuplexIO deployment.
#
# Capture the live six-cell frame for each admitted batch size. System and
# tool prefills run eagerly outside the decode graphs.
pipeline: duplexio
async_chunk: false
session_mode: duplex
active_stream_window: 2
dtype: bfloat16
enable_prefix_caching: false
enable_chunked_prefill: true

duplex_session:
  max_sessions: 2

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 2
    # Reserve one bounded compact cache layout per admitted session.
    max_model_len: 24576
    max_num_batched_tokens: 6144
    # FlexAttention tiles pages, so the page must be a power of two. Without
    # this the hybrid cache would derive 528 tokens per page from the mamba
    # state size. 1024 spans the same slots in fewer, larger pages.
    block_size: 1024
    gpu_memory_utilization: 0.7
    enforce_eager: false
    async_scheduling: false
    compilation_config:
      # Capture the backbone around its explicit compiler boundaries. Tensor
      # helpers, including the MLP, are compiled separately by the model.
      mode: 0
      cudagraph_mode: FULL_DECODE_ONLY
      cudagraph_capture_sizes: [6, 12]
      cudagraph_copy_inputs: true
