# Native two-stream DuplexIO deployment.
#
# DuplexIO's compact FlexAttention cache is request-aware, but its stable FULL
# CUDA graph mask is intentionally limited to one request. This profile keeps
# torch compilation enabled and runs the batched Flex/GDN path without FULL
# graph replay so two sessions can share one replica safely.
pipeline: duplexio
async_chunk: false
session_mode: duplex
active_stream_window: 2
dtype: bfloat16
enable_prefix_caching: false
enable_chunked_prefill: true

duplex_session:
  max_sessions: 2

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 2
    # Reserve one bounded compact cache layout per admitted session.
    max_model_len: 24576
    max_num_batched_tokens: 4096
    gpu_memory_utilization: 0.7
    enforce_eager: false
    async_scheduling: false
    compilation_config:
      mode: 3
      cudagraph_mode: NONE
    engine_extras:
      attention_config:
        flex_attn_block_m: 16
        flex_attn_block_n: 16
