# MOSS-TTS-Realtime turnwise sessions.
#
# Each HTTP turn is a complete vLLM request.  The server-owned session supplies
# a bounded preceding-turn window; the stage-0 AR loop and stage-1 codec run
# concurrently so codec work is overlapped with audio-code generation.
async_chunk: true
trust_remote_code: true

connectors:
  shm:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      codec_chunk_frames: 15
      codec_stream_slots: 16
      # Keep graph pools bounded on the shared stage-0/stage-1 GPU.  The codec
      # still batches ready requests per frame bucket eagerly; this controls
      # only optional per-batch CUDA graph capture.
      decode_cudagraph_capture_batch_sizes: [1]
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300

stages:
  - stage_id: 0
    # Sixteen active sequences is the measured saturation point on one H100 in
    # the 2,048-token bulk probe; additional requests remain queued without
    # increasing aggregate tokens/s.
    max_num_seqs: 16
    # 0.60 left ~0 GiB free once stage 1 exceeded its nominal budget and the
    # Convogen client parked its forced aligner on GPU 0: per-request
    # activation temporaries then OOMed the fullest replica.  0.55 keeps
    # several GiB of headroom while the KV pool stays far larger than
    # 16 seqs x 4096 tokens needs.
    gpu_memory_utilization: 0.55
    attention_backend: FLASHINFER
    # Realtime's RVQ prompt lives in ``additional_information`` and is not
    # part of vLLM's token-id prefix hash. Reusing a cached KV block would
    # therefore reuse the previous speaker's audio conditioning.
    enable_prefix_caching: false
    async_scheduling: true
    enable_chunked_prefill: true
    max_num_batched_tokens: 8192
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_1: shm
    default_sampling_params:
      temperature: 1.0
      top_p: 0.95
      top_k: 50
      max_tokens: 4096
      repetition_penalty: 1.1
      stop_token_ids: [151645]  # <|im_end|> emitted after audio EOS

  - stage_id: 1
    max_num_seqs: 16
    gpu_memory_utilization: 0.12
# Stage 1 decodes streamed codec chunks while stage 0 continues emitting
# frames.  Generic vLLM CUDA graphs remain disabled for the wrapper because
# its forward returns CPU audio/Python structures; the model-level decoder
# wrapper captures the actual codec path instead.
    enforce_eager: false
    attention_backend: FLASHINFER
    enable_prefix_caching: false
    async_scheduling: true
    compilation_config:
      cudagraph_mode: NONE
    max_num_batched_tokens: 196608
    max_model_len: 196608
    devices: "0"
    input_connectors:
      from_stage_0: shm
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.0
