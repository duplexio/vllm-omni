# Correctness baseline: native continuous batching, without CUDA graphs yet.
pipeline: duplexio
async_chunk: false
session_mode: duplex
active_stream_window: 8
dtype: bfloat16
enable_prefix_caching: false
enable_chunked_prefill: false

duplex_session:
  max_sessions: 8

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 8
    max_model_len: 24576
    max_num_batched_tokens: 24576
    gpu_memory_utilization: 0.8
    enforce_eager: true
    async_scheduling: false
    compilation_config:
      mode: 0
      cudagraph_mode: NONE
    engine_extras:
      attention_config:
        flex_attn_block_m: 16
        flex_attn_block_n: 16
