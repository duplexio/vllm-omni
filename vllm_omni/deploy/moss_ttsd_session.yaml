# MOSS-TTSD-v1.0 turnwise continuation with safe per-session prefix caching.
# The delay-pattern adapter buffers one complete turn, de-delays it, then sends
# a single payload to the v1 codec. The codec itself remains non-streaming.
async_chunk: true
trust_remote_code: true

connectors:
  shm:
    name: SharedMemoryConnector
    extra:
      codec_streaming: false
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 0

stages:
  - stage_id: 0
    max_num_seqs: 16
    gpu_memory_utilization: 0.60
    enable_prefix_caching: true
    async_scheduling: true
    max_num_batched_tokens: 8192
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_1: shm
    default_sampling_params:
      temperature: 1.1
      top_p: 0.9
      top_k: 50
      max_tokens: 4096
      repetition_penalty: 1.0

  - stage_id: 1
    max_num_seqs: 16
    gpu_memory_utilization: 0.12
    enforce_eager: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 196608
    max_model_len: 196608
    devices: "0"
    input_connectors:
      from_stage_0: shm
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.0
