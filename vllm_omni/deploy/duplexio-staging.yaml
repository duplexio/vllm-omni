# Native single-stage DuplexIO deployment.
pipeline: duplexio
async_chunk: false
session_mode: duplex
active_stream_window: 1
dtype: bfloat16
enable_prefix_caching: false
enable_chunked_prefill: true

duplex_session:
  max_sessions: 1

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    # Six scheduler positions represent one 80 ms DuplexIO frame. Keep the
    # complete cache layout while bounding each prefill/profile forward.
    max_model_len: 24576
    max_num_batched_tokens: 4096
    # Reserve activation headroom for the session's tool-aware system prefill.
    # The remaining KV cache still exceeds one maximum-length session.
    gpu_memory_utilization: 0.7
    # Snapshot staging: no torch.compile and no CUDA graphs, so the
    # pre-snapshot slept engine holds no live graph state that a restored
    # container could not rebuild. Wake only remaps weights H2D.
    enforce_eager: true
    async_scheduling: false
    compilation_config:
      mode: 0
      cudagraph_mode: NONE
    engine_extras:
      attention_config:
        # The hybrid cache page is not a power of two, but FlexAttention
        # kernel tiles must be. Leave flex_attn_kv_block_size unset: the
        # DuplexIO metadata builder defaults it to the largest power of two
        # dividing the physical page so flex blocks tile pages exactly.
        flex_attn_block_m: 16
        flex_attn_block_n: 16
