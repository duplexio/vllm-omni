# One graph-replayed rollout actor batching 32 independent conversations: the
# configuration behind the 2,450 live frames/s eight-H100 measurement.
base_config: duplexio_opd_h100.yaml
active_stream_window: 32
duplex_session:
  max_sessions: 32
stages:
  - stage_id: 0
    max_num_seqs: 32
    compilation_config:
      mode: 0
      cudagraph_mode: FULL_DECODE_ONLY
      cudagraph_capture_sizes: [6, 12, 18, 24, 30, 36, 42, 48, 54, 60, 66, 72, 78, 84, 90, 96, 102, 108, 114, 120, 126, 132, 138, 144, 150, 156, 162, 168, 174, 180, 186, 192]
      cudagraph_copy_inputs: true
